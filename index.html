<!DOCTYPE html>
<html>
<head>
    <title>The Encoder</title>
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
</head>

<body style="background-color: rgb(85, 210, 166); font-family: 'Courier Prime', monospace;">

<textarea id="messageInput" name="message" rows="10" cols="30"></textarea>

<div style="margin-top: 20px;">
  <button id="encodeBtn" style="color: white; background-color: rgb(132, 193, 254);"onclick="encode()">Encode</button>
  <button id="decodeBtn" style="margin-left: 10px; color: white; background-color: rgb(132, 193, 254); "onclick="decode()">Decode</button>
</div>

<div id="output" class="my-box" style="margin-top: 20px; padding: 50px; border: 5px solid black; min-height: 90px; min-width: 90px; text-align: left; background-color: rgb(212, 67, 67);">
Output of the encoder will be displayed here.
</div>


<script>
  const Alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
const Numbers = "0123456789";
const newAlphabet = "GQHZIMANBPXJYFLOKSRVETCDWU";
const newNumbers = "5931862704";

function decode() {
  const message = document.getElementById('messageInput').value.toUpperCase();
  let result = '';

  for (let i = 0; i < message.length; i++) {
    const char = message[i];
    const index = Alphabet.indexOf(char);
    const numIndex = Numbers.indexOf(char);

    if (index !== -1) {
      result += newAlphabet[index];
    } else if (numIndex !== -1) {
      result += newNumbers[numIndex];
    } else {
      result += char;
    }
  }

  document.getElementById('output').innerText = result;
}

function encode() {
  const message = document.getElementById('messageInput').value.toUpperCase();
  let result = '';

  for (let i = 0; i < message.length; i++) {
    const char = message[i];
    const index = newAlphabet.indexOf(char);
    const numIndex = newNumbers.indexOf(char);

    if (index !== -1) {
      result += Alphabet[index];
    } else if (numIndex !== -1) {
      result += Numbers[numIndex];
    } else {
      result += char;
    }
  }

  document.getElementById('output').innerText = result;
}

</script>
</body>
</html>
